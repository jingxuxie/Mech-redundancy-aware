[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redundancy-audit"
version = "0.1.0"
description = "Bounded-intervention discovery and conditional completeness certificates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
experiments = ["torch>=2.0", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
